name: tag-from-version

# Versiyon text'i tek kaynak: package.json'daki version degisince
# (main'e push), v${version} tag'i otomatik atilir (varsa atlanir).
# Tag atilinca: deploy + sync-desktop (desktop subtree + build) otomatik tetiklenir.
#
# Kullanim: package.json'da version 0.3.0 yap -> push -> tag + tum zincir otomatik.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag from version text
        env:
          SYNC_TOKEN: ${{ secrets.DESKTOP_SYNC_TOKEN }}
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          TAG="v${VER}"
          echo "version text: ${VER} -> tag: ${TAG}"
          # PAT ile push: GITHUB_TOKEN ile yapilan push'lar baska workflow'lari
          # tetiklemez (deploy/sync-desktop tetiklenmez); PAT ile tetiklenir.
          git remote set-url origin "https://x-access-token:${SYNC_TOKEN}@github.com/project-florence/web.git"
          # annotated tag icin git kimligi gerekir
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} zaten var, atlaniyor (deploy tetiklenmez)"
          else
            git tag -a "${TAG}" -m "release ${TAG} (otomatik, version text'inden)"
            git push origin "${TAG}"
            echo "Tag ${TAG} atildi -> deploy + desktop sync otomatik tetiklendi"
          fi
