name: deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/florence-web
            # Deploy mirror'i: yerel degisiklikler (npm'in lockfile dokunmasi vb.)
            # pull'u asla bloklamasin.
            git fetch origin
            git reset --hard origin/main
            npm ci
            npm run build
            # downloads dizinini KORU (indirme dosyalari + manifest) — sadece digerlerini temizle
            find /usr/share/nginx/html -mindepth 1 ! -name downloads -exec rm -rf {} +
            cp -r dist/* /usr/share/nginx/html/
